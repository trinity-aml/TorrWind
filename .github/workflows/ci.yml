name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Windows x64
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore TorrWind.sln -p:NuGetAudit=false

      - name: Build
        run: dotnet build TorrWind.sln --configuration Release --no-restore -m:1 -p:UseSharedCompilation=false -p:NuGetAudit=false

      - name: Test
        run: dotnet test TorrWind.sln --configuration Release --no-build -m:1 -p:UseSharedCompilation=false -p:NuGetAudit=false

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors) > $null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "Invalid PowerShell syntax in $($_.Name): $($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }
