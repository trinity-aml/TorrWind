name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v"
        required: true
        default: "1.0.0"
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}" -replace "^[vV]", ""
            $releaseTag = "v$version"
          } else {
            $releaseTag = "${{ github.ref_name }}"
            $version = $releaseTag -replace "^[vV]", ""
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release version is empty."
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/release-win-x64.ps1 -Version $env:VERSION -Configuration Release

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TorrWind-${{ env.VERSION }}-win-x64
          path: |
            artifacts/installer/TorrWind-${{ env.VERSION }}-win-x64.exe
            artifacts/portable/TorrWind-${{ env.VERSION }}-win-x64-portable.zip
            artifacts/TorrWind-${{ env.VERSION }}-SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: TorrWind ${{ env.VERSION }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            artifacts/installer/TorrWind-${{ env.VERSION }}-win-x64.exe
            artifacts/portable/TorrWind-${{ env.VERSION }}-win-x64-portable.zip
            artifacts/TorrWind-${{ env.VERSION }}-SHA256SUMS.txt
